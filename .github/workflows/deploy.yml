name: Deploy to Webuzo

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-webuzo
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Trim accidental whitespace/newlines from secrets
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            export VITE_API_URL="https://airestaurantbackend.toolkitpro.cloud"
          fi
          echo "Building with VITE_API_URL=$VITE_API_URL"
          npm run build

      - name: Check deploy secrets
        env:
          HAS_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY != '' }}
        run: |
          SSH_HOST="$(echo -n "$SSH_HOST" | tr -d '\r\n ')"
          SSH_USER="$(echo -n "$SSH_USER" | tr -d '\r\n ')"
          echo "SSH_HOST length: ${#SSH_HOST}"
          echo "SSH_USER length: ${#SSH_USER}"
          echo "HAS_SSH_KEY: $HAS_SSH_KEY"
          if [ -z "$SSH_HOST" ]; then echo "::error::SSH_HOST secret is empty"; exit 1; fi
          if [ -z "$SSH_USER" ]; then echo "::error::SSH_USER secret is empty"; exit 1; fi
          if [ "$HAS_SSH_KEY" != "true" ]; then echo "::error::SSH_PRIVATE_KEY secret is empty"; exit 1; fi
          echo "Secrets present. Continuing."
          echo "SSH_HOST=$SSH_HOST" >> "$GITHUB_ENV"
          echo "SSH_USER=$SSH_USER" >> "$GITHUB_ENV"

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Test SSH connection
        run: |
          set -x
          # Do not fail the job if keyscan cannot reach the host from GitHub IPs
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 10 -p 22 "$SSH_HOST" >> ~/.ssh/known_hosts 2>/tmp/keyscan.err || true
          if [ -s /tmp/keyscan.err ]; then
            echo "ssh-keyscan warning (ignored):"
            cat /tmp/keyscan.err
          fi
          # Accept new host keys; identity comes from ssh-agent
          ssh -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=20 \
              -o BatchMode=yes \
              "${SSH_USER}@${SSH_HOST}" "echo SSH_OK && pwd && whoami"

      - name: Deploy frontend (dist → public_html/airestaurant)
        run: |
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes" \
            --exclude '.git' \
            --exclude '.env' \
            dist/ "${SSH_USER}@${SSH_HOST}:/home/limiria/public_html/airestaurant/"

      - name: Deploy backend (backend → public_html/airestaurantbackend)
        run: |
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes" \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude 'uploads' \
            --exclude 'backend_log.txt' \
            --exclude 'scratch' \
            backend/ "${SSH_USER}@${SSH_HOST}:/home/limiria/public_html/airestaurantbackend/"

      - name: Install backend deps + PM2 start/restart
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" 'bash -s' << 'EOF'
          set -e
          cd /home/limiria/public_html/airestaurantbackend
          # Prefer full install so new deps (pm2) land even if lock is stale
          npm install --omit=dev

          # Run migrations and seed admin user
          node scripts/migrate.js || true
          node scripts/seed-admin.js || true

          # Use local pm2 only (parent public_html has a broken pm2 on PATH)
          PM2="./node_modules/.bin/pm2"
          if [ ! -x "$PM2" ]; then
            npm install pm2@5.4.3 --no-fund --no-audit
          fi
          if [ ! -x "$PM2" ]; then
            echo "::error::Local pm2 binary missing after npm install"
            ls -la node_modules/.bin/pm2 || true
            exit 1
          fi

          if "$PM2" describe airestaurant-api >/dev/null 2>&1; then
            "$PM2" restart airestaurant-api --update-env
          else
            "$PM2" start src/index.js --name airestaurant-api
          fi
          "$PM2" save
          "$PM2" status airestaurant-api
          echo "Backend deploy finished at $(date -u)"
          EOF
